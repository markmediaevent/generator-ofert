<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mark Media — Dyspozycyjność</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#091322;color:#f1f6ff;font:15px Arial,sans-serif}main{max-width:1200px;margin:auto;padding:24px 16px}.card{background:#121f34;border:1px solid #32455e;border-radius:18px;padding:20px;margin-bottom:18px}h1{margin:0 0 10px}p{line-height:1.5;color:#b7cae1}nav,.toolbar,.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,a,input{font:inherit}button,a{border:1px solid #4d6380;border-radius:10px;background:#253651;color:#fff;padding:11px 14px;cursor:pointer;text-decoration:none}input,select{background:#15273e;color:#fff;border:1px solid #627a99;padding:10px;border-radius:8px}button:disabled{opacity:.6;cursor:wait}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.weekday{color:#b7cae1;text-align:center;padding:8px}.day{min-height:94px;text-align:left;padding:10px;display:flex;flex-direction:column;gap:12px;background:#253651}.day strong{font-size:20px}.day span{font-size:12px}.available{background:#144d38!important;color:#dcfce7;border-color:#39c68a!important}.unavailable{background:#652937!important;color:#ffe4e6;border-color:#fb7185!important}.unknown{background:#253651;color:#c4d2e4}.today{outline:2px solid #82baff;outline-offset:2px}.legend span{padding:8px;border:1px solid #526480;border-radius:8px}#status{min-height:24px;color:#b7cae1}#status.error{color:#ff9bad}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #3d5069;text-align:center;padding:10px;min-width:44px}th:first-child,td:first-child{text-align:left;min-width:140px;position:sticky;left:0;background:#121f34}th small{display:block;color:#b7cae1}#teamTable caption{text-align:left;padding:10px 0;color:#b7cae1}.day-state-short{display:none}@media(max-width:600px){.day-state-long{display:none}.day-state-short{display:block;white-space:nowrap}.card{padding:14px}.calendar{gap:4px}.day{min-height:86px;padding:7px 3px}.day strong{font-size:17px}.day span{font-size:10px;overflow-wrap:anywhere}.weekday{padding:6px 0;font-size:12px}h1{font-size:25px}}
</style></head><body><main>
<header class="card"><h1 id="heading">Moja dyspozycyjność</h1><p id="intro">Zaznacz dni, w których możesz pracować. Niezaznaczony dzień oznacza brak deklaracji.</p><nav><a href="/packlists">Pack listy wydarzeń</a><a href="/admin" id="adminLink" hidden>Administracja</a><button id="toggle" hidden type="button">Mój kalendarz</button></nav></header>
<section class="card"><div class="toolbar"><button id="previous" type="button" aria-label="Poprzedni miesiąc">←</button><label>Miesiąc <input id="month" type="month" min="2000-01" max="2100-12"></label><button id="next" type="button" aria-label="Następny miesiąc">→</button><button id="refresh" type="button">Odśwież</button></div><p id="monthTitle"></p><div class="legend"><span class="available">✓ Dostępny</span><span class="unavailable">× Niedostępny</span><span class="unknown">— Brak deklaracji</span></div><p id="hint">Kliknij dzień, aby zmienić: Dostępny → Niedostępny → Brak deklaracji. Zapis jest automatyczny.</p><p id="status" role="status" aria-live="polite"></p><div id="calendar" class="calendar"></div><div id="teamTable" class="table-wrap" hidden></div></section>
</main><script src="/availability.js"></script></body></html>
