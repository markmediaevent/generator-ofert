<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie — Mark Media</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#040a13,#0b1629);color:#eef4ff;font-family:Inter,Arial,sans-serif}.card{width:min(460px,92vw);padding:28px;border-radius:24px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,rgba(18,30,52,.95),rgba(10,19,35,.95));box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{margin:0 0 8px;font-size:34px;letter-spacing:-.04em}p{margin:0 0 18px;color:#9bb0d4;line-height:1.7}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.field label{color:#9bb0d4;font-size:13px;font-weight:800}.field input{padding:14px 15px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(5,13,25,.72);color:#fff}.btn{width:100%;padding:14px 16px;border:none;border-radius:14px;background:linear-gradient(135deg,#1d4ed8,#4ea1ff);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.muted{margin-top:14px;font-size:12px;color:#9bb0d4}.error{min-height:20px;margin-top:12px;color:#ff8ea1;font-weight:700}a{color:#95d7ff}
  </style>
</head>
<body>
  <div class="card">
    <h1>Logowanie</h1>
    <p>Panel bazy sprzętu jest dostępny po zalogowaniu.</p>
    <form id="loginForm">
      <div class="field"><label for="username">Login</label><input id="username" name="username" value="admin" autocomplete="username" required></div>
      <div class="field"><label for="password">Hasło</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus></div>
      <button class="btn" id="submitBtn" type="submit">Zaloguj</button>
      <div class="error" id="error" role="alert"></div>
    </form>
    <div class="muted"><a href="/">← Wróć do strony głównej</a></div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const error = document.getElementById('error');
    const button = document.getElementById('submitBtn');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      button.disabled = true;
      button.textContent = 'Logowanie…';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: form.username.value.trim(), password: form.password.value })
        });
        const text = await response.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch { throw new Error('Serwer zwrócił nieprawidłową odpowiedź.'); }
        if (!response.ok || !data.ok) throw new Error(data.message || 'Nieprawidłowy login lub hasło.');
        localStorage.setItem('admin_token', data.token);
        location.replace('/admin');
      } catch (err) {
        error.textContent = err.message || 'Nie udało się połączyć z serwerem.';
      } finally {
        button.disabled = false;
        button.textContent = 'Zaloguj';
      }
    });
  </script>
</body>
</html>
