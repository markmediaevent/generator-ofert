<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Wrzutka — panel Mark Media</title>
<style>
:root{--bg:#06101d;--panel:rgba(14,25,46,.94);--line:rgba(255,255,255,.10);--text:#eef4ff;--muted:#9bb0d4;--blue:#4ea1ff;--red:#ff6375;--green:#27c777;--shadow:0 24px 64px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at top,#143868 0%,#071222 30%,#040a13 100%);min-height:100vh}.app{max-width:1400px;margin:0 auto;padding:24px}.top,.card{background:linear-gradient(180deg,var(--panel),rgba(9,18,34,.96));border:1px solid var(--line);box-shadow:var(--shadow)}.top{border-radius:28px;padding:19px 21px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:150px;max-height:52px;object-fit:contain}.brand h1{margin:0;font-size:30px;letter-spacing:-.04em}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;padding:11px 14px;border-radius:13px;cursor:pointer;font-weight:800;text-decoration:none;font-size:13px}.btn.blue{background:linear-gradient(135deg,#1d4ed8,#4ea1ff);border:0}.btn.red{background:linear-gradient(135deg,#ba3248,#ff6375);border:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{padding:17px;border-radius:19px;background:rgba(255,255,255,.04);border:1px solid var(--line)}.stat span{display:block;color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;font-size:26px;margin-top:7px}.card{border-radius:24px;padding:18px;margin-top:14px}.head{display:flex;justify-content:space-between;gap:14px;align-items:center}.head h2{margin:0;font-size:20px}.meta{color:var(--muted);font-size:12px;margin-top:5px}.files{display:grid;gap:8px;margin-top:14px}.file{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:11px 12px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}.file-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-size{color:var(--muted);font-size:12px}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.info{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.pill{padding:7px 10px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);border-radius:999px;font-size:12px;color:#dceaff}.note{margin-top:10px;color:#b7c8e4;line-height:1.55;font-size:13px}@media(max-width:800px){.top{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr}.file{grid-template-columns:1fr}.actions{width:100%}.actions .btn{flex:1;text-align:center}}
</style>
</head><body><div class="app">
<header class="top"><div class="brand"><img src="/logo.png" alt="Mark Media"><div><h1>Wrzutka</h1><p>Materiały przesłane przez klientów i organizatorów</p></div></div><div class="actions"><a class="btn" href="/app">Oferty</a><a class="btn" href="/admin">Magazyn</a><a class="btn" href="/wrzutka" target="_blank">Otwórz wrzutkę</a><a class="btn" href="https://drive.google.com/drive/folders/1R1v8RQVpYK6I6I4ePIQ76bVq7A-76xRA" target="_blank" rel="noopener">Google Drive</a><button class="btn blue" id="refresh">Odśwież</button><button class="btn red" id="logout">Wyloguj</button></div></header>
<section class="stats"><div class="stat"><span>Zgłoszenia</span><strong id="s1">0</strong></div><div class="stat"><span>Pliki</span><strong id="s2">0</strong></div><div class="stat"><span>Łączny rozmiar</span><strong id="s3">0 MB</strong></div></section>
<div id="list"></div></div>
<script>
const token=localStorage.getItem('admin_token');if(!token)location.href='/login';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=b=>{if(b<1024)return b+' B';let u=['KB','MB','GB'],v=b/1024,i=0;while(v>=1024&&i<u.length-1){v/=1024;i++}return v.toFixed(v>=100?0:v>=10?1:2)+' '+u[i]};
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token,...(opt.headers||{})}});if(r.status===401){localStorage.removeItem('admin_token');location.href='/login';return}const d=await r.json();if(!r.ok)throw new Error(d.message||'Błąd API');return d}
function date(s){try{return new Intl.DateTimeFormat('pl-PL',{dateStyle:'medium',timeStyle:'short'}).format(new Date(s))}catch{return s||''}}
async function load(){const box=document.getElementById('list');box.innerHTML='<div class="card empty">Ładowanie…</div>';try{const d=await api('/api/admin/wrzutka');const items=d.submissions||[];let count=0,size=0;items.forEach(x=>(x.files||[]).forEach(f=>{count++;size+=f.size||0}));s1.textContent=items.length;s2.textContent=count;s3.textContent=pretty(size);if(!items.length){box.innerHTML='<div class="card empty">Brak przesłanych materiałów.</div>';return}box.innerHTML=items.map(x=>`<section class="card"><div class="head"><div><h2>${esc(x.name||'Bez nazwy')}</h2><div class="meta">${date(x.createdAt)} · ID ${esc(x.id)}</div></div><div class="actions">${x.driveUrl?`<a class="btn" href="${esc(x.driveUrl)}" target="_blank" rel="noopener">Otwórz folder</a>`:''}<button class="btn red" onclick="delSub('${encodeURIComponent(x.id)}')">Usuń zgłoszenie</button></div></div><div class="info">${x.contact?`<span class="pill">Kontakt: ${esc(x.contact)}</span>`:''}<span class="pill">${(x.files||[]).length} plików</span></div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<div class="files">${(x.files||[]).map(f=>`<div class="file"><div><div class="file-name">${esc(f.originalName||f.name)}</div><div class="file-size">${pretty(f.size||0)}</div></div><button class="btn blue" onclick="downloadFile('${encodeURIComponent(x.id)}','${encodeURIComponent(f.name)}','${encodeURIComponent(f.originalName||f.name)}')">Pobierz</button><span class="file-size">${date(f.mtime)}</span></div>`).join('')}</div></section>`).join('')}catch(e){box.innerHTML='<div class="card empty">'+esc(e.message)+'</div>'}}
async function downloadFile(id,fileName,originalName){try{const r=await fetch('/api/admin/wrzutka/'+id+'/download/'+fileName,{headers:{Authorization:'Bearer '+token}});if(r.status===401){localStorage.removeItem('admin_token');location.href='/login';return}if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.message||'Nie udało się pobrać pliku.')}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=decodeURIComponent(originalName);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert(e.message)}}
async function delSub(id){if(!confirm('Usunąć całe zgłoszenie i wszystkie jego pliki?'))return;try{await api('/api/admin/wrzutka/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}
refresh.onclick=load;logout.onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('admin_token');location.href='/login'};load();
</script></body></html>
