<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070d18">
<title>Wizualizacje produkcji | Mark Media</title>
<style>
:root{color-scheme:dark;--bg:#070d18;--panel:#0d1b30;--line:rgba(139,184,242,.16);--ice:#f4f7ff;--muted:#a8bdd7;--cyan:#55c8fa;--blue:#2e72ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ice);background:radial-gradient(ellipse at 15% 0,rgba(31,103,214,.19),transparent 45%),radial-gradient(ellipse at 95% 75%,rgba(23,147,217,.11),transparent 35%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}.top{height:82px;border-bottom:1px solid var(--line);background:rgba(6,13,25,.75);display:flex;align-items:center}.top-in,.wrap{width:min(1120px,calc(100% - 40px));margin:auto}.top-in{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:.1em}.brand b{color:var(--cyan)}.brand small{display:block;color:#8ca1be;font-size:9px;letter-spacing:.27em;margin-top:4px}.back{color:#b9cbe0;text-decoration:none;font-size:13px}.wrap{padding:64px 0 90px}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:10px;font-weight:800;color:#84d8ff}.eyebrow:before{content:"";display:inline-block;width:25px;height:2px;vertical-align:middle;margin-right:10px;background:linear-gradient(90deg,#2968f6,#7ce2ff)}h1{font-size:clamp(38px,7vw,68px);line-height:1.04;letter-spacing:-.06em;margin:19px 0 13px}h1 em{font-style:normal;color:#71d6ff}.lead{max-width:660px;color:var(--muted);font-size:16px;line-height:1.75}.panel{max-width:520px;margin:40px 0 0;padding:28px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(17,38,65,.94),rgba(8,17,31,.92));box-shadow:0 25px 80px rgba(0,0,0,.24)}label{display:block;font-size:12px;font-weight:750;margin-bottom:9px}input[type=password]{width:100%;height:50px;padding:0 14px;color:white;background:#081424;border:1px solid rgba(151,192,242,.23);border-radius:10px;outline:none}input:focus{border-color:#55c8fa;box-shadow:0 0 0 3px rgba(85,200,250,.12)}.primary{min-height:48px;padding:0 20px;border:0;border-radius:10px;background:linear-gradient(120deg,#2769f8,#30adf5);color:white;font-weight:850}.panel .primary{width:100%;margin-top:15px}.msg{min-height:22px;color:#ffb7b7;font-size:13px;margin:11px 0 0}.gallery-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:56px 0 24px}.gallery-head h2{font-size:26px;margin:0}.muted{color:var(--muted);font-size:13px}.logout{background:transparent;color:#c5d7eb;border:1px solid var(--line);padding:10px 14px;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{overflow:hidden;background:rgba(13,27,48,.82);border:1px solid var(--line);border-radius:16px}.card img{display:block;width:100%;max-height:520px;object-fit:contain;background:#050a11}.card-body{padding:19px}.card h3{font-size:18px;margin:0 0 7px}.card p{margin:0;color:#afc3dc;line-height:1.65;font-size:14px}.card-meta{color:#76cefb;font-size:10px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:9px}.empty{padding:28px;border:1px dashed rgba(139,184,242,.25);border-radius:14px;color:var(--muted);line-height:1.7}.hidden{display:none!important}footer{border-top:1px solid var(--line);padding:24px 0;color:#7890ad;font-size:11px}.error{color:#ffb7b7}
@media(max-width:650px){.wrap{padding-top:44px}.top{height:72px}.grid{grid-template-columns:1fr}.panel{padding:22px}.gallery-head{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand">MARK <b>MEDIA</b><small>EVENT SOLUTION</small></div><a class="back" href="/">Strona główna ↗</a></div></header>
<main class="wrap">
<div class="eyebrow">PRYWATNA PREZENTACJA</div>
<h1>Wizualizacje<br><em>produkcji.</em></h1>
<p class="lead">Podgląd koncepcji i oprawy technicznej przygotowanej dla Twojego wydarzenia.</p>
<form id="login" class="panel">
<label for="password">Hasło dostępu</label>
<input id="password" type="password" autocomplete="current-password" required>
<button class="primary" type="submit">Otwórz prezentację</button>
<p id="login-msg" class="msg" aria-live="polite"></p>
</form>
<section id="content" class="hidden">
<div class="gallery-head"><div><h2>Materiały dla Ciebie</h2><p class="muted">Wizualizacje przygotowane przez zespół Mark Media.</p></div><button id="logout" class="logout" type="button">Wyloguj</button></div>
<div id="gallery" class="grid"></div>
</section>
</main>
<footer><div class="top-in">Mark Media Event Solution · Wizualizacje produkcji</div></footer>
<script>
(function(){
'use strict';
var form=document.getElementById('login'),password=document.getElementById('password'),message=document.getElementById('login-msg'),content=document.getElementById('content'),gallery=document.getElementById('gallery');
function node(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e}
function showGallery(items){form.classList.add('hidden');content.classList.remove('hidden');gallery.textContent='';if(!items.length){gallery.appendChild(node('div','empty','Wizualizacje pojawią się tutaj po przygotowaniu prezentacji.'));return}
items.forEach(function(item){var card=node('article','card'),img=document.createElement('img');img.src=item.imageUrl;img.alt=item.title;img.loading='lazy';var body=node('div','card-body');body.appendChild(node('div','card-meta',item.client));body.appendChild(node('h3','',item.title));if(item.description)body.appendChild(node('p','',item.description));card.appendChild(img);card.appendChild(body);gallery.appendChild(card)})}
function load(){fetch('/api/wizualizacje',{credentials:'same-origin',cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('auth');return r.json()}).then(function(data){showGallery(data.visualizations||[])}).catch(function(){form.classList.remove('hidden');content.classList.add('hidden')})}
form.addEventListener('submit',function(e){e.preventDefault();message.textContent='Sprawdzam hasło…';fetch('/api/wizualizacje/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})}).then(function(r){return r.json().then(function(data){if(!r.ok)throw new Error(data.message||'Nie udało się zalogować.');return data})}).then(function(){message.textContent='';password.value='';load()}).catch(function(err){message.textContent=err.message||'Nie udało się zalogować.'})});
document.getElementById('logout').addEventListener('click',function(){fetch('/api/wizualizacje/wyloguj',{method:'POST',credentials:'same-origin'}).finally(function(){form.classList.remove('hidden');content.classList.add('hidden')})});
load();
})();
</script>
</body>
</html>
