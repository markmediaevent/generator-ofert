services:
  - type: web
    name: generator-ofert
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: STORAGE_DIR
        value: /var/data
    disk:
      name: generator-ofert-data
      mountPath: /var/data
      sizeGB: 1
