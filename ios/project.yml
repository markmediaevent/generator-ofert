name: MarkMedia
options:
  bundleIdPrefix: pl.markmedia
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  MarkMedia:
    type: application
    platform: iOS
    sources: [MarkMedia]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.markmedia.generatorofert
        INFOPLIST_FILE: MarkMedia/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      gatherCoverageData: false
