services:
  - type: web
    name: marknet-serwis-test
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    repo: https://github.com/markmediaevent/generator-ofert
    branch: paprec-service-2026
    autoDeployTrigger: off
    buildCommand: cd paprec-service && npm install --omit=dev --no-audit --no-fund && npm run check
    startCommand: cd paprec-service && npm start
    domains:
      - serwis.marknet.com.pl
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_NAME
        value: PAPREC Energies Gdańsk
      - key: DATABASE_URL
        fromDatabase:
          name: marknet-serwis-staging-db
          property: connectionString

databases:
  - name: marknet-serwis-staging-db
    plan: 0.1c-256mb
    region: frankfurt
    diskSizeGB: 1
    postgresMajorVersion: '18'
    databaseName: marknet_serwis_staging_db
    user: marknet_serwis_staging_db_user
